name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inject Supabase Credentials
        run: |
          # Debug: Show current directory and files
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la

          # Debug: Show file content before replacement
          echo "=== File content BEFORE sed ==="
          cat game-config.js

          # Debug: Check if secrets are accessible
          echo "=== Secrets accessibility check ==="
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL is set (length: ${#SECRET})"
          else
            echo "SUPABASE_URL is NOT set"
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY is set"
          else
            echo "SUPABASE_ANON_KEY is NOT set"
          fi

          # Replace placeholders with actual credentials from secrets
          echo "=== Running sed commands ==="
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.SUPABASE_URL }}|g" game-config.js
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.SUPABASE_ANON_KEY }}|g" game-config.js

          # Debug: Show file content after replacement
          echo "=== File content AFTER sed ==="
          cat game-config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: radioscouting.ie
